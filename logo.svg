<svg width="680" height="320" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Silent Knock</title>
<desc>A dark navy door with a teal knob doubling as the knock point on the right edge, white "silent_knock" lettering centered inside the door, and radar rings radiating right from the knob.</desc>

<rect x="80" y="70" width="130" height="170" rx="6" fill="#0f2942" stroke="#1e4d78" stroke-width="2"/>

<text x="145" y="150" text-anchor="middle" font-family="monospace" font-size="20" font-weight="500" fill="#ffffff">silent</text>
<text x="145" y="178" text-anchor="middle" font-family="monospace" font-size="20" font-weight="500" fill="#ffffff">_knock</text>

<circle cx="203" cy="155" r="5" fill="#4fd1c5"/>

<g stroke="#4fd1c5" fill="none" stroke-width="1.2" opacity="0.55">
<circle cx="270" cy="155" r="30"/>
<circle cx="270" cy="155" r="55"/>
<circle cx="270" cy="155" r="80"/>
</g>

<text x="220" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a8f98">recon container // quiet by design</text>
</svg>
